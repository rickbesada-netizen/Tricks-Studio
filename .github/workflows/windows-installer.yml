name: Windows installer
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build app
        run: dotnet publish desktop/TricksStudio.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          & $iscc installer/TricksStudio.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Test installation and app startup
        shell: pwsh
        run: |
          $installer = (Resolve-Path ./out/TricksStudioSetup.exe).Path
          $target = Join-Path $env:RUNNER_TEMP 'Tricks Studio verification'
          $setup = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=""$target""") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          $app = Start-Process (Join-Path $target 'TricksStudio.exe') -ArgumentList '--smoke-test' -PassThru
          if (!$app.WaitForExit(30000)) { $app.Kill(); throw 'App startup test timed out' }
          if ($app.ExitCode -ne 0) { throw 'App startup test failed' }
      - name: Verify with Microsoft Defender
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if (!$status.AntivirusEnabled) {
            Write-Warning 'Microsoft Defender Antivirus is unavailable on this runner. No Defender scan performed.'
            'Defender scan: unavailable on the hosted runner.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            'DEFENDER_RESULT=Not scanned (Defender Antivirus unavailable on the hosted runner).' | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }
          $started = [DateTime]::UtcNow
          $installer = (Resolve-Path ./out/TricksStudioSetup.exe).Path
          $target = Join-Path $env:RUNNER_TEMP 'Tricks Studio verification'
          Start-MpScan -ScanType CustomScan -ScanPath $installer
          Start-MpScan -ScanType CustomScan -ScanPath $target
          if (!(Test-Path $installer) -or !(Test-Path (Join-Path $target 'TricksStudio.exe'))) {
            throw 'An expected file was missing after the Defender scan.'
          }
          $detections = Get-MpThreatDetection | Where-Object {
            $_.InitialDetectionTime.ToUniversalTime() -ge $started -and
            ($_.Resources -match 'TricksStudioSetup\.exe|Tricks Studio verification')
          }
          if ($detections) { throw 'Defender reported a detection' }
          'DEFENDER_RESULT=Custom Defender scan completed with no detection reported.' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish one-file preview
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-preview-$env:GITHUB_RUN_ID"
          $hash = (Get-FileHash ./out/TricksStudioSetup.exe -Algorithm SHA256).Hash
          $notes = @(
            'Windows x64 preview. Installation and editor startup passed on the GitHub Windows runner.',
            "Defender: $env:DEFENDER_RESULT",
            'This build is unsigned. If Windows Security blocks it, leave it blocked.',
            'FFmpeg is required for video import and export.',
            "SHA-256: $hash"
          ) -join "`n`n"
          gh release create $tag ./out/TricksStudioSetup.exe --target $env:GITHUB_SHA --title 'Tricks Studio Windows preview' --prerelease --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release upload failed.' }
